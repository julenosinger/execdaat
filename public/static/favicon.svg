<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ExecDaat">
  <defs>
    <!-- Brand tile gradient (purple → blue) -->
    <linearGradient id="daBg" gradientUnits="userSpaceOnUse" x1="40" y1="20" x2="472" y2="492">
      <stop offset="0" stop-color="#6C4CFF"/>
      <stop offset="0.55" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#2C8DFF"/>
    </linearGradient>
    <!-- Glossy top-left highlight -->
    <radialGradient id="daGloss" cx="0.28" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Futuristic edge glow (cyan → purple) -->
    <linearGradient id="daEdge" gradientUnits="userSpaceOnUse" x1="106" y1="126" x2="406" y2="386">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <!-- Financial symbol gradient -->
    <linearGradient id="daSym" gradientUnits="userSpaceOnUse" x1="200" y1="360" x2="312" y2="150">
      <stop offset="0" stop-color="#5B4BFF"/>
      <stop offset="1" stop-color="#2C8DFF"/>
    </linearGradient>
    <filter id="daShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A1024" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#daBg)"/>
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#daGloss)"/>
  <rect x="4" y="4" width="504" height="504" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Blockchain node dots (network) -->
  <g fill="#FFFFFF" opacity="0.55">
    <circle cx="181" cy="126" r="9"/>
    <circle cx="331" cy="126" r="9"/>
    <circle cx="406" cy="256" r="9"/>
    <circle cx="331" cy="386" r="9"/>
    <circle cx="181" cy="386" r="9"/>
    <circle cx="106" cy="256" r="9"/>
  </g>

  <!-- Hexagon block (blockchain) -->
  <path d="M181 126 L331 126 L406 256 L331 386 L181 386 L106 256 Z"
        fill="#FFFFFF" filter="url(#daShadow)"/>
  <path d="M181 126 L331 126 L406 256 L331 386 L181 386 L106 256 Z"
        fill="none" stroke="url(#daEdge)" stroke-width="7" stroke-linejoin="round" opacity="0.9"/>

  <!-- Financial symbol: US dollar (payments / stablecoin) -->
  <text x="257" y="352" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="800" font-size="272" fill="url(#daSym)">$</text>
</svg>
